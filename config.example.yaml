tenant_id: "YOUR-ENTRA-TENANT-ID"
client_id: "YOUR-APP-REGISTRATION-CLIENT-ID"
mailbox: "buzon@tudespacho.mx"
responsible_email: "responsable@tudespacho.mx"
language: es   # es | en — UI/alert language (default es)
poll_interval_s: 300
allowed_domains:
  - sat.gob.mx
use_claude: false
secrets_path: clients.secret
state_path: state.sqlite
download_dir: downloads
settings_path: ui_settings.json   # web-UI settings (alert words + recipient)
portal:
  # SAT's official Buzón Tributario login page (checked 2026-11-20). Alerts link here
  # for "log in manually". The old cfdiau.sat.gob.mx/nidp/app/login?id=... addresses
  # now open an empty "Select an authentication card" page.
  buzon_url: "https://wwwmat.sat.gob.mx/personas/iniciar-sesion"
  # Login frame embedded in that page (RFC + Contraseña + captcha; the e.firma option is
  # chosen inside the same page). UNVERIFIED for automation: the frame did not load from
  # a test machine outside Mexico — confirm on-site (docs/manual-validation.md).
  ciec_login_url: "https://wwwmat.sat.gob.mx/app/seg/faces/pages/lanzador.jsf?url=/buzon&tipoLogeo=c&target=principal"
  efirma_login_url: "https://wwwmat.sat.gob.mx/app/seg/faces/pages/lanzador.jsf?url=/buzon&tipoLogeo=c&target=principal"
  notifications_selector: "table#notificaciones tbody tr"
  download_link_selector: "a.descargar"
# keyword_map: optional override; omit to use built-in Spanish defaults
# Optional WhatsApp alerts (Meta WhatsApp Cloud API) — see README "WhatsApp alerts".
# The access token is NOT stored here: set the JULIA_WA_TOKEN environment variable.
whatsapp:
  enabled: false
  phone_number_id: "YOUR-WHATSAPP-PHONE-NUMBER-ID"
  recipients:
    - "52XXXXXXXXXX"          # international format, digits only (Mexico: 52 + 10 digits)
  template: julia_aviso_sat   # approved Utility template with two variables {{1}} {{2}}
  template_lang: es_MX        # en_US if the template was created in English
  include_client_details: true  # false = send only the event, never the client name/RFC
  api_version: v21.0
